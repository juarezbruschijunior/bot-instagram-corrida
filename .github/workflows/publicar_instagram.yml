name: Bot Instagram Cinema - Agendador Automatico 4x ao Dia

on:
  schedule:
    # Horários em UTC (Brasil é UTC-3):
    # 08:30 BRT = 11:30 UTC
    # 12:30 BRT = 15:30 UTC
    # 17:30 BRT = 20:30 UTC
    # 21:15 BRT = 00:15 UTC
    - cron: '30 11 * * *'
    - cron: '30 15 * * *'
    - cron: '30 20 * * *'
    - cron: '15 0 * * *'
    # Ping a cada 10 minutos para manter o Render e respostas de comentários ativas
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  executar_bot_cinema:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo do Bot
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar Dependencias
        run: |
          pip install -r requirements.txt

      - name: Ping Keep-Alive no Render
        run: |
          curl -s -m 10 https://bot-instagram-corrida.onrender.com || true

      - name: Executar Ciclo de Cinema / Respostas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python main.py --cron
